<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#1e293b;
      --card: rgba(15, 23, 42, 0.72);
      --text:#e2e8f0;
      --muted:#94a3b8;
      --accent:#38bdf8;
      --accent2:#22c55e;
      --danger:#ef4444;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --ring: rgba(56,189,248,.25);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top, var(--bg2), var(--bg1));color:var(--text);overflow:auto}
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;
      background:linear-gradient(135deg, rgba(255,255,255,.05), transparent 35%, rgba(255,255,255,.03));
      mix-blend-mode:screen;
    }
    #app{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
    .shell{
      width:min(760px, 100%);
      display:grid;grid-template-columns:1fr;gap:18px;
      position:relative;z-index:2;
    }
    .panel{
      background:var(--card);
      border:1px solid rgba(255,255,255,.12);
      border-radius:24px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(18px);
      padding:22px;
    }
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .title{font-size:1.35rem;font-weight:800;letter-spacing:.2px}
    .subtitle{font-size:.9rem;color:var(--muted)}
    .theme-row{display:flex;flex-wrap:wrap;gap:10px}
    .theme-btn{
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
      background:rgba(255,255,255,.06);
      padding:10px 14px;border-radius:999px;cursor:pointer;
      transition:.2s transform,.2s background,.2s border-color;
      font-weight:600;
    }
    .theme-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.25)}
    .theme-btn.active{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3)}
    .main{
      display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:center;
    }
    @media (max-width: 720px){.main{grid-template-columns:1fr}}
    .timerWrap{
      display:flex;align-items:center;justify-content:center;position:relative;
      min-height:300px;
    }
    .ring{
      width:260px;height:260px;border-radius:50%;
      background:conic-gradient(var(--accent) 0deg, var(--ring) 0deg);
      padding:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
      position:relative;
    }
    .ring::before{
      content:"";position:absolute;inset:14px;border-radius:50%;
      background:rgba(2,6,23,.72);border:1px solid rgba(255,255,255,.08);
    }
    .timerCore{
      position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;z-index:1;
    }
    .time{font-size:3.4rem;font-weight:900;line-height:1;color:#fff;letter-spacing:-1px}
    .state{margin-top:8px;font-size:.95rem;color:var(--muted);font-weight:600}
    .controls{display:flex;flex-direction:column;gap:14px}
    .sliderBox{
      background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
      border-radius:18px;padding:16px;
    }
    .sliderHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .sliderLabel{font-weight:700}
    .minutes{font-size:1.15rem;font-weight:900;color:#fff}
    input[type="range"]{
      width:100%;appearance:none;height:10px;border-radius:999px;outline:none;
      background:linear-gradient(90deg, var(--accent) 0%, rgba(255,255,255,.12) 0%);
    }
    input[type="range"]::-webkit-slider-thumb{
      appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--accent);
      box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;
    }
    input[type="range"]::-moz-range-thumb{
      width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--accent);cursor:pointer;
    }
    .marks{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:8px}
    .btnRow{display:flex;flex-wrap:wrap;gap:10px}
    .btn{
      border:none;border-radius:14px;padding:13px 16px;font-weight:800;cursor:pointer;
      color:#fff;transition:.2s transform,.2s opacity,.2s box-shadow;flex:1;min-width:110px;
      box-shadow:0 10px 20px rgba(0,0,0,.18);
    }
    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .start{background:linear-gradient(135deg,#22c55e,#16a34a)}
    .pause{background:linear-gradient(135deg,#f59e0b,#d97706)}
    .restart{background:linear-gradient(135deg,#38bdf8,#2563eb)}
    .complete{background:linear-gradient(135deg,#ef4444,#b91c1c)}
    .quote{
      position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);
      width:min(760px, calc(100vw - 30px)); z-index:20;
      background:rgba(15,23,42,.88);border:1px solid rgba(255,255,255,.14);
      border-radius:24px;padding:24px 22px;box-shadow:0 30px 80px rgba(0,0,0,.45);
      opacity:0;pointer-events:none;transition:.35s ease;
      text-align:center;
    }
    .quote.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
    .quoteText{font-size:1.35rem;line-height:1.5;font-weight:700;color:#fff}
    .quoteAuthor{margin-top:12px;color:#cbd5e1;font-weight:600}
    #fx{
      position:fixed;inset:0;pointer-events:none;z-index:10;
    }
    .hidden{display:none}
    .bg-theme-stars{--bg1:#020617;--bg2:#0f172a;--accent:#38bdf8;--accent2:#a855f7}
    .bg-theme-forest{--bg1:#052e16;--bg2:#14532d;--accent:#4ade80;--accent2:#86efac}
    .bg-theme-sunset{--bg1:#3b0764;--bg2:#be123c;--accent:#fb7185;--accent2:#f59e0b}
    .bg-theme-ocean{--bg1:#042f2e;--bg2:#0f766e;--accent:#22d3ee;--accent2:#14b8a6}
    .bg-theme-neon{--bg1:#111827;--bg2:#1f2937;--accent:#f472b6;--accent2:#60a5fa}
    .spark{
      position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;will-change:transform,opacity;
      box-shadow:0 0 10px currentColor;
    }
    .cheer{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:15;
      pointer-events:none;font-size:clamp(2rem, 8vw, 5rem);font-weight:900;color:#fff;text-shadow:0 0 24px rgba(255,255,255,.35);
      opacity:0;transform:scale(.8);
    }
    .cheer.show{animation:cheerPop 1.2s ease forwards}
    @keyframes cheerPop{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.05)}60%{opacity:1}100%{opacity:0;transform:scale(1.2)}}
  </style>
</head>
<body class="bg-theme-stars">
  <canvas id="fx"></canvas>
  <div class="cheer" id="cheer">🎉 Great Job! 🎉</div>
  <div id="app">
    <div class="shell">
      <div class="panel">
        <div class="topbar">
          <div>
            <div class="title">Pomodoro Timer</div>
            <div class="subtitle">Choose a theme and focus on one task at a time.</div>
          </div>
        </div>
        <div class="theme-row" id="themes">
          <button class="theme-btn active" data-theme="stars">Stars</button>
          <button class="theme-btn" data-theme="forest">Forest</button>
          <button class="theme-btn" data-theme="sunset">Sunset</button>
          <button class="theme-btn" data-theme="ocean">Ocean</button>
          <button class="theme-btn" data-theme="neon">Neon</button>
        </div>
      </div>

      <div class="panel main">
        <div class="timerWrap">
          <div class="ring" id="ring">
            <div class="timerCore">
              <div class="time" id="time">05:00</div>
              <div class="state" id="state">Ready</div>
            </div>
          </div>
        </div>

        <div class="controls">
          <div class="sliderBox">
            <div class="sliderHead">
              <div class="sliderLabel">Work duration</div>
              <div class="minutes"><span id="mins">5</span> min</div>
            </div>
            <input id="slider" type="range" min="5" max="25" step="5" value="5" />
            <div class="marks"><span>5</span><span>10</span><span>15</span><span>20</span><span>25</span></div>
          </div>

          <div class="btnRow">
            <button class="btn start" id="startBtn">Start</button>
            <button class="btn pause" id="pauseBtn" disabled>Pause</button>
            <button class="btn restart" id="restartBtn">Restart</button>
            <button class="btn complete" id="completeBtn">Complete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="quote" id="quoteBox">
    <div class="quoteText" id="quoteText"></div>
    <div class="quoteAuthor" id="quoteAuthor"></div>
  </div>

<script>
(() => {
  const themes = {
    stars: { cls: 'bg-theme-stars', colors: ['#38bdf8','#a855f7','#ffffff','#60a5fa'] },
    forest:{ cls: 'bg-theme-forest', colors: ['#4ade80','#86efac','#fef08a','#ffffff'] },
    sunset:{ cls: 'bg-theme-sunset', colors: ['#fb7185','#f59e0b','#f472b6','#ffffff'] },
    ocean: { cls: 'bg-theme-ocean', colors: ['#22d3ee','#14b8a6','#60a5fa','#ffffff'] },
    neon:  { cls: 'bg-theme-neon', colors: ['#f472b6','#60a5fa','#34d399','#ffffff'] }
  };
  const quotes = [
    {t:"Success is the sum of small efforts, repeated day in and day out.", a:"Robert Collier"},
    {t:"It always seems impossible until it’s done.", a:"Nelson Mandela"},
    {t:"The future depends on what you do today.", a:"Mahatma Gandhi"},
    {t:"Great things are done by a series of small things brought together.", a:"Vincent van Gogh"},
    {t:"You are capable of amazing things.", a:"Unknown"}
  ];

  const slider = document.getElementById('slider');
  const mins = document.getElementById('mins');
  const time = document.getElementById('time');
  const state = document.getElementById('state');
  const ring = document.getElementById('ring');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');
  const completeBtn = document.getElementById('completeBtn');
  const quoteBox = document.getElementById('quoteBox');
  const quoteText = document.getElementById('quoteText');
  const quoteAuthor = document.getElementById('quoteAuthor');
  const cheer = document.getElementById('cheer');
  const fx = document.getElementById('fx');
  const ctx = fx.getContext('2d');
  let duration = 5 * 60, remaining = duration, timer = null, running = false, paused = false, quoteTimer = null, particles = [];
  let currentTheme = 'stars', lastQuote = -1;

  function resize(){ fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
  addEventListener('resize', resize); resize();

  function fmt(s){ s = Math.max(0, Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
  function updateRing(){
    const pct = Math.max(0, remaining / duration);
    const deg = 360 * pct;
    ring.style.background = `conic-gradient(var(--accent) ${deg}deg, rgba(255,255,255,.08) 0deg)`;
    time.textContent = fmt(remaining);
    mins.textContent = slider.value;
  }
  function setState(txt){ state.textContent = txt; }

  function start(){
    if (running) return;
    duration = Number(slider.value) * 60;
    if (!paused && remaining > duration) remaining = duration;
    running = true; paused = false;
    setState('Focus mode');
    startBtn.disabled = true; pauseBtn.disabled = false; pauseBtn.textContent = 'Pause';
    timer = setInterval(() => {
      remaining -= 1;
      updateRing();
      if (remaining <= 0) completeTask();
    }, 1000);
  }

  function pause(){
    if (!running) return;
    clearInterval(timer); timer = null; running = false; paused = true;
    setState('Paused');
    startBtn.disabled = false; startBtn.textContent = 'Resume';
    pauseBtn.textContent = 'Paused';
  }

  function restart(){
    clearInterval(timer); timer = null; running = false; paused = false;
    duration = Number(slider.value) * 60;
    remaining = duration;
    quoteBox.classList.remove('show');
    setState('Ready');
    startBtn.disabled = false; startBtn.textContent = 'Start';
    pauseBtn.disabled = true; pauseBtn.textContent = 'Pause';
    updateRing();
  }

  function randomQuote(){
    let idx = Math.floor(Math.random() * quotes.length);
    if (quotes.length > 1) while (idx === lastQuote) idx = Math.floor(Math.random() * quotes.length);
    lastQuote = idx;
    return quotes[idx];
  }

  function playCheer(){
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ac = new AudioCtx();
      const master = ac.createGain(); master.gain.value = 0.12; master.connect(ac.destination);
      const tones = [523.25, 659.25, 783.99, 1046.5];
      tones.forEach((f, i) => {
        const o = ac.createOscillator(); const g = ac.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, ac.currentTime + i*0.08);
        g.gain.exponentialRampToValueAtTime(0.35, ac.currentTime + i*0.08 + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + i*0.08 + 0.28);
        o.connect(g).connect(master); o.start(ac.currentTime + i*0.08); o.stop(ac.currentTime + i*0.08 + 0.3);
      });
      const noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i] = Math.random()*2-1;
      const src = ac.createBufferSource(); src.buffer = noiseBuf;
      const filter = ac.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value = 1200;
      const ng = ac.createGain(); ng.gain.value = 0.04;
      src.connect(filter).connect(ng).connect(master);
      src.start(ac.currentTime + 0.05); src.stop(ac.currentTime + 0.45);
      setTimeout(() => ac.close(), 1200);
    }catch(e){}
  }

  function burst(){
    particles = [];
    const count = 180;
    const colors = themes[currentTheme].colors;
    for(let i=0;i<count;i++){
      particles.push({
        x: innerWidth * (0.25 + Math.random()*0.5),
        y: innerHeight * (0.2 + Math.random()*0.35),
        vx: (Math.random()*2-1) * (2 + Math.random()*8),
        vy: (Math.random()*2-1) * (2 + Math.random()*8),
        life: 80 + Math.random()*40,
        color: colors[(Math.random()*colors.length)|0],
        size: 1.5 + Math.random()*3.5
      });
    }
  }

  function animate(){
    ctx.clearRect(0,0,fx.width,fx.height);
    const w = fx.width / devicePixelRatio, h = fx.height / devicePixelRatio;
    particles = particles.filter(p => p.life > 0);
    for(const p of particles){
      p.life -= 1;
      p.vy += 0.06;
      p.x += p.vx; p.y += p.vy;
      ctx.globalAlpha = Math.max(0, p.life / 120);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }
  animate();

  function completeTask(){
    clearInterval(timer); timer = null; running = false; paused = false;
    remaining = 0; updateRing();
    setState('Completed');
    startBtn.disabled = false; startBtn.textContent = 'Start';
    pauseBtn.disabled = true; pauseBtn.textContent = 'Pause';
    burst(); playCheer();
    cheer.classList.remove('show'); void cheer.offsetWidth; cheer.classList.add('show');
    const q = randomQuote();
    quoteText.textContent = q.t;
    quoteAuthor.textContent = "— " + q.a;
    quoteBox.classList.add('show');
    clearTimeout(quoteTimer);
    quoteTimer = setTimeout(() => {
      quoteBox.classList.remove('show');
      cheer.classList.remove('show');
      restart();
    }, 5000);
  }

  document.getElementById('themes').addEventListener('click', e => {
    const btn = e.target.closest('.theme-btn');
    if(!btn) return;
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTheme = btn.dataset.theme;
    document.body.className = themes[currentTheme].cls;
    document.documentElement.style.setProperty('--accent', themes[currentTheme].colors[0]);
    document.documentElement.style.setProperty('--accent2', themes[currentTheme].colors[1]);
    updateRing();
  });

  slider.addEventListener('input', () => {
    mins.textContent = slider.value;
    if (!running && !paused) {
      duration = Number(slider.value) * 60;
      remaining = duration;
      updateRing();
    }
    const pct = ((slider.value - 5) / 20) * 100;
    slider.style.background = `linear-gradient(90deg, var(--accent) ${pct}%, rgba(255,255,255,.12) ${pct}%)`;
  });

  startBtn.onclick = () => { if (paused) { running = true; paused = false; timer = setInterval(() => { remaining -= 1; updateRing(); if (remaining <= 0) completeTask(); }, 1000); setState('Focus mode'); startBtn.disabled = true; pauseBtn.disabled = false; pauseBtn.textContent = 'Pause'; } else { duration = Number(slider.value) * 60; if (remaining <= 0 || remaining > duration) remaining = duration; start(); } updateRing(); };
  pauseBtn.onclick = pause;
  restartBtn.onclick = restart;
  completeBtn.onclick = completeTask;

  updateRing();
  slider.dispatchEvent(new Event('input'));
})();
</script>
</body>
</html>
